name: Update GitHub Profile Statistics

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

jobs:
  generate-profile-stats:
    name: Generate Profile Statistics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      # --------------------------------------------------
      # GitHub Statistics
      # --------------------------------------------------

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&theme=transparent&hide_border=true&title_color=7DD3FC&icon_color=60A5FA&text_color=C9D1D9&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # Top Languages
      # --------------------------------------------------

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=transparent&hide_border=true&title_color=7DD3FC&text_color=C9D1D9
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # Contribution Streak
      # --------------------------------------------------

      - name: Generate Contribution Streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          USERNAME: ${{ github.repository_owner }}
          COLOR: "7DD3FC"
          BACKGROUND: "transparent"
          BORDER: "transparent"
          RING: "60A5FA"
          FIRE: "60A5FA"
          STREAK_NUM: "7DD3FC"
          SIDE_NUM: "C9D1D9"
          STREAK_LABEL: "7DD3FC"
          SIDE_LABEL: "C9D1D9"
          DATE: "8B949E"
          SHOW_TOTAL_CONTRIBUTIONS: "true"
          HIDE_BORDER: "true"
          OUTPUT_PATH: "profile/streak.svg"

      # --------------------------------------------------
      # Commit generated SVG files
      # --------------------------------------------------

      - name: Commit generated SVG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No statistics changes."
            exit 0
          fi

          git commit -m "Update GitHub profile statistics"
          git push